<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Szene</title>
<style>
/* Leichtbau-Regel: nur Transparenz und Verschiebung animieren, keine Unschaerfe, keine Schatten, keine Filter. */
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"Liberation Sans Narrow","Liberation Sans",Arial,sans-serif}
.t{position:absolute;color:#fff;font-weight:700;white-space:nowrap}

/* ---- Vollbild-Titelkarte (tc) ---- */
#tc{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#0d0d0d;opacity:0;transition:opacity .5s ease}
#tc.on{opacity:1}
#tc_in{position:absolute;left:160px;right:160px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#tc[data-align="left"] #tc_in{align-items:flex-start;text-align:left}
#tc_title{color:#fff;font-weight:700;font-size:132px;line-height:150px;white-space:nowrap;transform-origin:center center}
#tc[data-align="left"] #tc_title,#tc[data-align="left"] #tc_sub{transform-origin:left center}
#tc_line{width:260px;height:8px;margin:34px 0;background:#1fa012;transform:skewX(-25deg)}
#tc_sub{color:#dcdcdc;font-size:60px;line-height:72px;white-space:nowrap;transform-origin:center center}

/* ---- Spielstand (sb) ---- */
#sb{position:absolute;width:1100px;height:150px;opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
#sb[data-pos="top-center"]{left:380px;top:50px;transform:translateY(-250px)}
#sb[data-pos="top-left"]{left:60px;top:50px;transform:translateY(-250px)}
#sb[data-pos="bottom-center"]{left:380px;bottom:60px;transform:translateY(250px)}
#sb.on{opacity:1;transform:none}
#sb .row{position:absolute;left:0;top:50px;width:1100px;height:100px;background:#141414}
#sb_c1{position:absolute;left:0;top:50px;width:26px;height:100px}
#sb_c2{position:absolute;left:1074px;top:50px;width:26px;height:100px}
#sb .n{position:absolute;top:50px;height:100px;line-height:100px;font-size:54px;font-weight:700;color:#fff;white-space:nowrap}
#sb_n1{left:46px;width:380px;text-align:left}
#sb_n2{left:674px;width:380px;text-align:right}
#sb .s{position:absolute;top:50px;width:110px;height:100px;line-height:100px;text-align:center;font-size:80px;font-weight:700;color:#fff;background:#262626;transition:transform .25s ease}
#sb_s1{left:430px}
#sb_s2{left:560px}
#sb .s.bump{transform:scale(1.18)}
#sb_sep{position:absolute;left:540px;top:50px;width:20px;height:100px;line-height:96px;text-align:center;font-size:60px;color:#fff;font-weight:700}
#sb_label{position:absolute;left:0;top:0;width:1100px;height:46px;line-height:46px;text-align:center;font-size:30px;font-weight:700;letter-spacing:3px;color:#fff;white-space:nowrap}
#sb_lbg{position:absolute;left:300px;top:0;width:500px;height:46px;background:#262626}
#sb_clock{position:absolute;left:810px;top:0;width:290px;height:46px;line-height:46px;text-align:center;font-size:34px;font-weight:700;color:#ffd24a;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- Uhr (ck) ---- */
#ck{position:absolute;width:380px;height:150px;opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
#ck[data-pos="top-right"]{right:60px;top:70px;transform:translateY(-250px)}
#ck[data-pos="top-left"]{left:80px;top:70px;transform:translateY(-250px)}
#ck[data-pos="bottom-right"]{right:60px;bottom:70px;transform:translateY(250px)}
#ck[data-pos="bottom-left"]{left:80px;bottom:70px;transform:translateY(250px)}
#ck.on{opacity:1;transform:none}
#ck .bg{position:absolute;left:0;top:0;width:380px;height:150px;background:#141414}
#ck_acc{position:absolute;left:0;top:0;width:380px;height:10px}
#ck_label{position:absolute;left:0;top:18px;width:380px;text-align:center;color:#d0d0d0;font-size:30px;line-height:36px;font-weight:700;white-space:nowrap;letter-spacing:2px}
#ck_time{position:absolute;left:0;top:50px;width:380px;text-align:center;color:#fff;font-size:84px;line-height:96px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#ck_time.done{color:#ff4040}

/* ---- Namenseinblendung (np) ---- */
#np{position:absolute;height:96px;opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s ease}
#np[data-pos="bottom-left"]{left:90px;bottom:100px;transform:translateX(-900px)}
#np[data-pos="bottom-right"]{right:90px;bottom:100px;transform:translateX(900px)}
#np[data-pos="top-left"]{left:90px;top:100px;transform:translateX(-900px)}
#np[data-pos="top-right"]{right:90px;top:100px;transform:translateX(900px)}
#np.on{opacity:1;transform:none}
#np_wrap{position:relative;display:inline-block;height:96px;min-width:300px}
#np .bg{position:absolute;left:30px;top:0;height:96px;right:0;transform:skewX(-20deg);background:#141414}
#np_bar{position:absolute;left:0;top:0;width:22px;height:96px;transform:skewX(-20deg)}
#np_t{position:relative;display:block;margin-left:76px;margin-right:60px;line-height:96px;font-size:56px;font-weight:700;color:#fff;white-space:nowrap;transform-origin:left center}

/* ---- Bauchbinde (lt) ---- */
#lt{position:absolute;width:1500px;height:200px;opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .5s ease}
#lt[data-pos="bottom-left"]{left:90px;bottom:90px;transform:translateX(-1700px)}
#lt[data-pos="bottom-right"]{right:90px;bottom:90px;transform:translateX(1700px)}
#lt[data-pos="top-left"]{left:90px;top:90px;transform:translateX(-1700px)}
#lt[data-pos="top-right"]{right:90px;top:90px;transform:translateX(1700px)}
#lt.on{opacity:1;transform:none}
#lt .band{position:absolute;left:30px;top:20px;width:1340px;height:130px;transform:skewX(-25deg);background:#141414}
#lt .stripe{position:absolute;left:1215px;top:20px;width:80px;height:130px;transform:skewX(-25deg);background:#c9c9c9}
#lt .cap{position:absolute;left:1295px;top:20px;width:110px;height:130px;transform:skewX(-25deg);background:#000}
#lt_tab{position:absolute;left:450px;top:128px;width:640px;height:56px;transform:skewX(-25deg)}
#lt .line{position:absolute;height:3px}
#lt .t{transform-origin:left center;opacity:0;transition:opacity .4s ease .25s}
#lt.on .t{opacity:1}
#lt_l1{left:150px;top:36px;font-size:74px;line-height:90px}
#lt_l2{left:520px;top:128px;width:480px;font-size:34px;line-height:56px;text-align:center}

/* ---- Trenner (sl), liegt ueber allem ---- */
#sl{position:absolute;left:0;top:430px;width:1920px;height:220px;overflow:hidden}
#sl_band{position:absolute;left:100px;top:0;width:1720px;height:220px;background:#e0a000;transform:translateX(-2100px) skewX(-25deg);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#sl_band.on{transform:translateX(0) skewX(-25deg)}
#sl_band.out{transform:translateX(2100px) skewX(-25deg);transition:transform .6s cubic-bezier(.6,0,.8,.4)}
#sl_band .e1{position:absolute;left:0;top:0;width:1720px;height:14px;background:#fff}
#sl_band .e2{position:absolute;left:0;bottom:0;width:1720px;height:14px;background:#fff}
#sl_t{position:absolute;left:0;top:0;width:1920px;height:220px;text-align:center;line-height:220px;font-size:132px;font-weight:700;font-style:italic;letter-spacing:6px;color:#101010;white-space:nowrap;opacity:0;transition:opacity .35s ease .2s}
#sl_t.on{opacity:1}
#sl_t.out{opacity:0;transition:opacity .2s ease}
</style></head><body>

<div id="tc" data-align="center"><div id="tc_in"><div id="tc_title"></div><div id="tc_line"></div><div id="tc_sub"></div></div></div>

<div id="sb" data-pos="top-center">
  <div id="sb_lbg"></div><div id="sb_label"></div><div id="sb_clock"></div>
  <div class="row"></div><div id="sb_c1"></div><div id="sb_c2"></div>
  <div class="n" id="sb_n1"></div><div class="s" id="sb_s1">0</div><div id="sb_sep">:</div><div class="s" id="sb_s2">0</div><div class="n" id="sb_n2"></div>
</div>

<div id="ck" data-pos="top-right"><div class="bg"></div><div id="ck_acc"></div><div id="ck_label"></div><div id="ck_time">00:00</div></div>

<div id="np" data-pos="bottom-left"><div id="np_wrap"><div class="bg"></div><div id="np_bar"></div><span id="np_t"></span></div></div>

<div id="lt" data-pos="bottom-left">
  <div class="line" id="lt_ln1" style="left:150px;top:6px;width:780px"></div>
  <div class="line" id="lt_ln2" style="left:20px;top:176px;width:440px"></div>
  <div class="band"></div><div class="stripe"></div><div class="cap"></div>
  <div id="lt_tab"></div>
  <div class="t" id="lt_l1"></div><div class="t" id="lt_l2"></div>
</div>

<div id="sl"><div id="sl_band"><div class="e1"></div><div class="e2"></div></div><div id="sl_t"></div></div>

<script>
function $(id) { return document.getElementById(id); }
function parse(d) { try { if (typeof d === 'string') d = JSON.parse(d); if (d && typeof d.b64 === 'string') d = JSON.parse(decodeURIComponent(escape(atob(d.b64)))); } catch (e) { return {}; } return d || {}; }
function fit(el, maxW) { el.style.transform = ''; var w = el.scrollWidth; if (w > maxW) el.style.transform = 'scaleX(' + (maxW / w) + ')'; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function show(id, on) { $(id).classList.toggle('on', !!on); }

var W = {};
// Jede Gruppe bekommt nur ihre geaenderten Felder (ohne Praefix) und alle bekannten Werte
function route(o) {
  var touched = {};
  Object.keys(o).forEach(function (k) {
    var i = k.indexOf('_'); if (i < 0) return;
    var id = k.slice(0, i), key = k.slice(i + 1);
    if (!W[id]) return;
    W[id].data[key] = o[k];
    (touched[id] = touched[id] || {})[key] = o[k];
  });
  Object.keys(touched).forEach(function (id) { W[id].apply(touched[id], W[id].data); });
}
function reg(id, apply) { W[id] = { data: {}, apply: apply }; }

reg('tc', function (c) {
  if (c.title !== undefined) { $('tc_title').textContent = c.title; fit($('tc_title'), 1600); }
  if (c.subtitle !== undefined) { $('tc_sub').textContent = c.subtitle; fit($('tc_sub'), 1600); }
  if (c.bg) $('tc').style.background = c.bg;
  if (c.accent) $('tc_line').style.background = c.accent;
  if (c.align) $('tc').setAttribute('data-align', c.align);
  if (c.on !== undefined) show('tc', c.on);
});

var lastScore = { s1: null, s2: null };
function setScore(id, v) {
  var el = $(id), txt = String(Math.round(Number(v) || 0));
  if (lastScore[id] !== null && lastScore[id] !== txt) { el.classList.add('bump'); setTimeout(function () { el.classList.remove('bump'); }, 280); }
  lastScore[id] = txt; el.textContent = txt;
}
function fitSide(el, maxW) { el.style.transform = ''; var w = el.scrollWidth; if (w > maxW) el.style.transform = 'scaleX(' + (maxW / w) + ')'; el.style.transformOrigin = el.id === 'sb_n2' ? 'right center' : 'left center'; }
reg('sb', function (c) {
  if (c.name1 !== undefined) { $('sb_n1').textContent = c.name1; fitSide($('sb_n1'), 372); }
  if (c.name2 !== undefined) { $('sb_n2').textContent = c.name2; fitSide($('sb_n2'), 372); }
  if (c.score1 !== undefined) setScore('sb_s1', c.score1);
  if (c.score2 !== undefined) setScore('sb_s2', c.score2);
  if (c.color1) $('sb_c1').style.background = c.color1;
  if (c.color2) $('sb_c2').style.background = c.color2;
  if (c.label !== undefined) { $('sb_label').textContent = c.label; $('sb_lbg').style.display = c.label ? 'block' : 'none'; }
  if (c.clock !== undefined) $('sb_clock').textContent = c.clock;
  if (c.position) $('sb').setAttribute('data-pos', c.position);
  if (c.on !== undefined) show('sb', c.on);
});

// Uhr / Countdown / Stoppuhr
var ck = { mode: 'clock', seconds: 0, show_seconds: true, running: false, base: 0, startedAt: 0, last: '' };
function ckElapsed() { return ck.running ? ck.base + (Date.now() - ck.startedAt) / 1000 : ck.base; }
function ckFmt(total) { total = Math.max(0, Math.floor(total)); var h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = total % 60; return (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(s); }
function ckText() {
  var el = $('ck_time');
  if (ck.mode === 'countdown') { var rest = Math.max(0, ck.seconds - ckElapsed()); el.className = rest <= 0 ? 'done' : ''; return ckFmt(Math.ceil(rest)); }
  if (ck.mode === 'stopwatch') { el.className = ''; return ckFmt(ck.seconds + ckElapsed()); }
  el.className = ''; var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + (ck.show_seconds ? ':' + pad(d.getSeconds()) : '');
}
function ckTick() { var t = ckText(); if (t !== ck.last) { ck.last = t; $('ck_time').textContent = t; } }
reg('ck', function (c) {
  var reset = (c.mode !== undefined && c.mode !== ck.mode) || (c.seconds !== undefined && Number(c.seconds) !== ck.seconds);
  if (c.mode !== undefined) ck.mode = c.mode;
  if (c.seconds !== undefined) ck.seconds = Number(c.seconds) || 0;
  if (c.show_seconds !== undefined) ck.show_seconds = !!c.show_seconds;
  if (reset) { ck.base = 0; ck.startedAt = Date.now(); }
  if (c.running !== undefined) {
    if (c.running && !ck.running) { ck.running = true; ck.startedAt = Date.now(); }
    else if (!c.running && ck.running) { ck.base = ckElapsed(); ck.running = false; }
  }
  if (c.label !== undefined) $('ck_label').textContent = c.label;
  if (c.color) $('ck_acc').style.background = c.color;
  if (c.position) $('ck').setAttribute('data-pos', c.position);
  ck.last = ''; ckTick();
  if (c.on !== undefined) show('ck', c.on);
});
setInterval(function () { if ($('ck').classList.contains('on')) ckTick(); }, 200);

reg('np', function (c) {
  if (c.text !== undefined) { var t = $('np_t'); t.textContent = c.text; t.style.transform = ''; var w = t.offsetWidth; if (w > 1300) t.style.transform = 'scaleX(' + (1300 / w) + ')'; }
  if (c.color) $('np_bar').style.background = c.color;
  if (c.position) $('np').setAttribute('data-pos', c.position);
  if (c.on !== undefined) show('np', c.on);
});

reg('lt', function (c) {
  if (c.line1 !== undefined) { $('lt_l1').textContent = c.line1; fit($('lt_l1'), 1030); }
  if (c.line2 !== undefined) { $('lt_l2').textContent = c.line2; fit($('lt_l2'), 480); }
  if (c.color) { $('lt_tab').style.background = c.color; $('lt_ln1').style.background = c.color; $('lt_ln2').style.background = c.color; }
  if (c.position) $('lt').setAttribute('data-pos', c.position);
  if (c.on !== undefined) show('lt', c.on);
});

// Trenner: laeuft bei jeder Aenderung des Ausloese-Zaehlers (nicht beim ersten Laden) und blendet sich selbst wieder aus
var slTimer = null, slSeen = false, slLast = 0;
function slPlay() {
  $('sl_band').className = 'on'; $('sl_t').className = 'on';
  if (slTimer) clearTimeout(slTimer);
  slTimer = setTimeout(slHide, Math.max(500, (Number(W.sl.data.hold) || 2) * 1000));
}
function slHide() {
  if (slTimer) { clearTimeout(slTimer); slTimer = null; }
  $('sl_band').className = 'out'; $('sl_t').className = 'out';
  setTimeout(function () { $('sl_band').className = ''; $('sl_t').className = ''; }, 700);
}
reg('sl', function (c) {
  if (c.text !== undefined) $('sl_t').textContent = c.text;
  if (c.color) $('sl_band').style.background = c.color;
  if (c.textcolor) $('sl_t').style.color = c.textcolor;
  if (c.trigger !== undefined) {
    var n = Number(c.trigger) || 0;
    if (slSeen && n !== slLast) slPlay();
    slSeen = true; slLast = n;
  }
});

window.update = function (d) { route(parse(d)); };
window.play = function () {};
window.stop = function () { ['tc', 'sb', 'ck', 'np', 'lt'].forEach(function (id) { show(id, false); }); slHide(); };
window.next = function () {};
</script></body></html>
