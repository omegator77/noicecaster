<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="270" viewBox="0 0 1500 270">
  <defs>
    <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{ACCENT}}"/>
      <stop offset="1" stop-color="{{ACCENT2}}"/>
    </linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E6E6"/>
    </linearGradient>
    <linearGradient id="gSub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A8A8A"/>
      <stop offset="0.35" stop-color="#4A4A4A"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="gTab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A7A7A"/>
      <stop offset="1" stop-color="#2E2E2E"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="7" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <polygon points="700,16 1318,16 1384,78 700,78" fill="url(#gTab)"/>
    <polygon points="200,70 1380,70 1470,152 200,152" fill="url(#gBand)"/>
    <polygon points="380,162 1330,162 1386,216 424,216" fill="url(#gSub)"/>
    <polygon points="1380,70 1416,70 1500,152 1464,152" fill="{{ACCENT}}"/>
    <polygon points="344,160 382,162 424,216 386,214" fill="{{ACCENT}}"/>
    <polygon points="0,26 250,26 396,170 396,216 0,216" fill="url(#gAccent)"/>
  </g>
  {{LOGO}}
  <text x="1010" y="56" text-anchor="middle" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="{{TITLE_SIZE}}" letter-spacing="1.5" fill="#EDEDED">{{TITLE}}</text>
  <text x="830" y="126" text-anchor="middle" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-style="italic" font-size="{{MAIN_SIZE}}" fill="#2B2B2B">{{MAIN}}</text>
  <text x="880" y="200" text-anchor="middle" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="{{SUB_SIZE}}" fill="#FFFFFF">{{SUB}}</text>
</svg>
