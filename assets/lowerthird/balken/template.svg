<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="210" viewBox="0 0 1500 210">
  <defs>
    <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101418" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#2A313A" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{ACCENT}}"/>
      <stop offset="1" stop-color="{{ACCENT2}}"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <polygon points="0,52 1370,52 1440,196 0,196" fill="url(#gBand)"/>
    <rect x="0" y="52" width="26" height="144" fill="url(#gAccent)"/>
    <polygon points="26,10 610,10 646,52 26,52" fill="{{ACCENT}}"/>
    <polygon points="1370,52 1396,52 1466,196 1440,196" fill="{{ACCENT}}"/>
  </g>
  {{LOGO}}
  <text x="58" y="42" text-anchor="start" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="bold" font-size="{{TITLE_SIZE}}" letter-spacing="1.5" fill="#FFFFFF">{{TITLE}}</text>
  <text x="58" y="122" text-anchor="start" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-weight="bold" font-size="{{MAIN_SIZE}}" fill="#FFFFFF">{{MAIN}}</text>
  <text x="58" y="176" text-anchor="start" font-family="Nimbus Sans, DejaVu Sans, sans-serif" font-size="{{SUB_SIZE}}" fill="#D5DAE0">{{SUB}}</text>
</svg>
